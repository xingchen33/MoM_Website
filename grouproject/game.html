<!DOCTYPE html>
<html>
	<head>
		<title>Real or Fake?</title>
		<link rel="stylesheet" href="css/base.css"/>
		<link rel="stylesheet" href="css/game.css"/>
		

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
	</head>

	<body>
		

		<div id="instructionDiv">
			<h1>Real or Fake?</h1>
			<hr/>
			<h2>Instructions</h2>
			<p id="instructionText">Read the article below! Decide if you think it is real or fake and choose accordingly.</p>
		</div>
		<p id="resultText"></p>

		<div id="gameDiv">
			<div id="scoreDiv">
				<p id="scoreText"></p>
    			<p id="timerText">Time Left:</p>
    		</div>
			<div id="article">
				<h3 id="articleTitle">Article_Title</h3>
				<p id="articleDate">Date</p>
				<div id="articleContent">
					<p>Article</p>
				</div>

			</div>
			<div id="buttonDiv">
				<button id="realButton">REAL</button>
				<button id="fakeButton">FAKE</button>
				<input type="hidden" id="answerInput" name="answer" value="">
				<button id="nextButton">NEXT</button>
				
			</div>
		</div>

	</body>
</html>
